        .switch-container {

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: #2196F3;
        }
        
        input:focus + .slider {
            box-shadow: 0 0 1px #2196F3;
        }
        
        input:checked + .slider:before {
            transform: translateX(26px);
        }

        async function handleFinalTranscription(transcriptText) {
            if (!transcriptText || isProcessingFinal) return;
            
            isProcessingFinal = true;
            try {
                removeLoadingBubble();
                
                // Set up the prompt input properly
                const promptInput = document.getElementById('prompt');
                const askButton = document.getElementById('ask-button');
                
                // Set the transcribed text in the prompt input
                promptInput.value = transcriptText;

                // Don't add the bubble here as sendtobed will do it
                // addBubble(transcriptText, true);

                // Update button state before calling sendtobed
                askButton.textContent = 'Please wait...';
                askButton.disabled = true;

                // Call sendtobed - it will handle adding the bubble and making the API call
                await sendtobed();
                
                // Reset button state if needed
                askButton.disabled = false;
                askButton.textContent = 'Go';

            } catch (error) {
                console.error('Error handling final transcription:', error);
                showMessage('Error processing transcription', 'error');
                
                // Reset button state in case of error
                const askButton = document.getElementById('ask-button');
                askButton.disabled = false;
                askButton.textContent = 'Go';
            } finally {
                isProcessingFinal = false;
            }
        }


        function connectWebSocket() {
            return new Promise((resolve, reject) => {
                socket = new WebSocket(TRANSCRIBE_NEW_API_ENDPOINT);

                socket.onopen = () => {
                    console.log('WebSocket connected');
                    resolve();
                };

                socket.onmessage = async (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        console.log('Received WebSocket message:', data);

                        if (data.type === 'error' && data.message.includes('timed out')) {
                            // Handle timeout gracefully - don't show error to user if still recording
                            if (isRecording) {
                                console.log('Transcribe timeout - continuing to record');
                                return;
                            }
                        }

                        if (data.type === 'transcription') {
                            const transcriptText = data.text.trim();
                            
                            if (data.isFinal) {
                                if (transcriptText) {
                                    removeLoadingBubble();
                                    const promptInput = document.getElementById('prompt');
                                    promptInput.value = transcriptText;
                                    await sendtobed();
                                }
                            } else {
                                updateLoadingBubble(transcriptText || 'Listening...');
                            }
                        }
                    } catch (error) {
                        console.error('Error handling transcription:', error);
                        if (!isRecording) { // Only show error if not still recording
                            showMessage('Error processing transcription', 'error');
                            removeLoadingBubble();
                        }
                    }
                };

                socket.onclose = () => {
                    console.log('WebSocket disconnected');
                    if (keepAliveInterval) {
                        clearInterval(keepAliveInterval);
                        keepAliveInterval = null;
                    }
                    if (isRecording) {
                        stopRecording();
                    }
                };

                socket.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    showMessage('Connection error. Please try again.', 'error');
                    reject(error);
                };
            });
        }

        async function startRecording() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        channelCount: 1,
                        sampleRate: 16000
                    }
                });

                audioContext = new AudioContext({ sampleRate: 16000 });
                audioInput = audioContext.createMediaStreamSource(mediaStream);
                processor = audioContext.createScriptProcessor(2048, 1, 1);

                audioInput.connect(processor);
                processor.connect(audioContext.destination);

                let lastAudioTime = Date.now();

                // Start keep-alive interval
                keepAliveInterval = setInterval(() => {
                    if (socket?.readyState === WebSocket.OPEN && isRecording) {
                        // Send empty audio chunk every 10 seconds if no audio
                        if (Date.now() - lastAudioTime > 10000) {
                            socket.send(JSON.stringify({
                                action: 'sendAudio',
                                data: '', // empty audio data
                                isFinal: false
                            }));
                        }
                    }
                }, 10000); // Check every 10 seconds

                processor.onaudioprocess = (e) => {
                    if (!isRecording || socket?.readyState !== WebSocket.OPEN) return;

                    try {
                        const inputData = e.inputBuffer.getChannelData(0);
                        
                        // Check if there's actual audio data (not just silence)
                        const hasAudio = inputData.some(sample => Math.abs(sample) > 0.01);
                        
                        if (hasAudio) {
                            lastAudioTime = Date.now();
                            const pcmData = new Int16Array(inputData.length);
                            
                            for (let i = 0; i < inputData.length; i++) {
                                const s = Math.max(-1, Math.min(1, inputData[i]));
                                pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                            }

                            socket.send(JSON.stringify({
                                action: 'sendAudio',
                                data: btoa(String.fromCharCode.apply(null, new Uint8Array(pcmData.buffer))),
                                isFinal: false
                            }));
                        }
                    } catch (error) {
                        console.error('Audio processing error:', error);
                        stopRecording();
                    }
                };

            } catch (error) {
                console.error('Error starting recording:', error);
                throw error;
            }
        }

        async function stopRecording() {
            try {
                // Clear the keep-alive interval
                if (keepAliveInterval) {
                    clearInterval(keepAliveInterval);
                    keepAliveInterval = null;
                }

                // Send final signal
                if (socket?.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        action: 'sendAudio',
                        data: '',
                        isFinal: true
                    }));
                }

                // Cleanup resources
                if (processor) {
                    processor.disconnect();
                    processor.onaudioprocess = null;
                }
                if (audioInput) {
                    audioInput.disconnect();
                }
                if (audioContext) {
                    await audioContext.close();
                }
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                }

                // Reset variables
                processor = null;
                audioInput = null;
                audioContext = null;
                mediaStream = null;

            } catch (error) {
                console.error('Error stopping recording:', error);
                throw error;
            }
        }

        // Utility Functions
        function findSimilarPrompts(currentPrompt, oldPrompts, threshold = 58) {
            const similarPrompts = [];
             let nthreshold = document.getElementById('nthresholdin').value;
            let fspi = '';
            

            oldPrompts.forEach(oldPromptObj => {
                const oldPrompt = oldPromptObj.prompt;
                const similarity = calculateSimilarity(currentPrompt.toLowerCase(), oldPrompt.toLowerCase());

                if (similarity > nthreshold) {
                    similarPrompts.push({ 
                        id: oldPromptObj.id, 
                        prompt: oldPrompt, 
                        similarity 
                    });

                    if (similarity === 100) {
                        fspi = oldPromptObj.id;
                    } else if (similarity > highestSimilarity) {
                        highestSimilarity = similarity;
                        fspi = oldPromptObj.id;
                    }
                }
            });

            return similarPrompts.sort((a, b) => b.similarity - a.similarity);
        }

        function calculateSimilarity(str1, str2) {
            const maxLength = Math.max(str1.length, str2.length);
            const distance = levenshteinDistance(str1, str2);
            return ((maxLength - distance) / maxLength) * 100;
        }

        function levenshteinDistance(str1, str2) {
            const m = str1.length;
            const n = str2.length;
            const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(null));

            for (let i = 0; i <= m; i++) dp[i][0] = i;
            for (let j = 0; j <= n; j++) dp[0][j] = j;

            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (str1[i - 1] === str2[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1];
                    } else {
                        dp[i][j] = Math.min(
                            dp[i - 1][j] + 1,
                            dp[i][j - 1] + 1,
                            dp[i - 1][j - 1] + 1
                        );
                    }
                }
            }

            return dp[m][n];
        }
